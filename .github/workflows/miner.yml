name: Marsad Miner Loop

on:
  schedule:
    - cron: '*/30 * * * *'   # كل 30 دقيقة، يشتغل حتى لو هاتفك مطفي
  workflow_dispatch: {}

jobs:
  mine:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run miner (one cycle)
        env:
          GITHUB_TOKEN_1: ${{ secrets.GITHUB_TOKEN_1 }}
          GITHUB_TOKEN_2: ${{ secrets.GITHUB_TOKEN_2 }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python3 historical_truth_miner_v1.py

      - name: Commit new data back to repo
        run: |
          git config user.name "marsad-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/ || true
          git commit -m "miner batch $(date -u +%Y%m%d_%H%M)" || echo "لا تغييرات جديدة"
          git push
