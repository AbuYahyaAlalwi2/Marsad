services:
  - type: web
    name: marsad-dashboard
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python3 dashboard_api.py
    envVars:
      - key: CG_DB_PATH
        value: /tmp/cyberguard.db
      - key: CG_PLATFORM
        value: render
      - key: CG_NO_BROWSER
        value: "true"
      - key: CG_NO_AUTOSTART
        value: "false"
      - key: CG_ENABLE_VPN
        value: "false"
      - key: CG_CLOUD_AUTO_PROVISION
        value: "false"
      - key: PORT
        value: "10000"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: CG_BOOTSTRAP_STAGE
        value: "4"
      - key: CG_EMAIL_POOL_SIZE
        value: "50"
      - key: CG_ORCH_COLLECT
        value: "300"
      - key: CG_SCALE_COOLDOWN
        value: "120"
      - key: CG_SELF_PING
        value: "true"
      - key: CG_SELF_URL
        value: "https://marsad-dashboard.onrender.com"
      - key: CG_CONTROL_PLANE_URL
        value: "https://marsad-dashboard.onrender.com"
      - key: CG_MAX_AGENTS
        value: "1000000"
      - key: CG_TARGET_AGENTS
        value: "1000000"
      - key: CG_DEPLOY_DRY_RUN
        value: "true"
      - key: RAILWAY_TOKEN
        sync: false
      - key: KOYEB_TOKEN
        sync: false
      - key: KOYEB_APP
        value: "marsad-worker"
      - key: RAILWAY_SERVICE
        value: "marsad-worker"
      - key: CG_SCALE_UP_QUEUE
        value: "1"
      - key: CG_SCALE_UP_CPU
        value: "20"
      - key: CG_SCALE_UP_RAM
        value: "50"
      - key: CG_AUTODEPLOY_INTERVAL
        value: "60"
