<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4299e1"/>
      <stop offset="100%" stop-color="#2b6cb0"/>
    </radialGradient>
  </defs>
  <rect width="256" height="256" rx="48" fill="#0f1b2d"/>

  <!-- حلقات رادار متحدة المركز (نبضة مراقبة/مسح — تمثل "مرصد") -->
  <circle cx="128" cy="128" r="96" fill="none" stroke="#2b6cb0" stroke-width="3" opacity="0.35"/>
  <circle cx="128" cy="128" r="70" fill="none" stroke="#2b6cb0" stroke-width="3" opacity="0.5"/>
  <circle cx="128" cy="128" r="44" fill="none" stroke="#4299e1" stroke-width="3" opacity="0.7"/>

  <!-- نقطة المركز -->
  <circle cx="128" cy="128" r="14" fill="url(#core)"/>

  <!-- إبرة المسح -->
  <path d="M128 128 L188 78" stroke="#63b3ed" stroke-width="4" stroke-linecap="round"/>
  <circle cx="188" cy="78" r="6" fill="#90cdf4"/>

  <!-- ثلاث عقد صغيرة حول المركز — ترمز لمجموعات الوكلاء المُدارة -->
  <circle cx="70" cy="176" r="7" fill="#68d391"/>
  <circle cx="182" cy="176" r="7" fill="#f6ad55"/>
  <circle cx="128" cy="60" r="7" fill="#fc8181"/>
</svg>
